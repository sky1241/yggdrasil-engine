<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yggdrasil · WT4 Forme 3D</title>
<style>
:root { --bg-0: #0a0a0a; --text-1: #E5E5E5; --text-2: #A3A3A3; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-1); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
#info {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  background: rgba(30,30,30,0.85); border-radius: 12px; padding: 16px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); max-width: 380px; backdrop-filter: blur(8px);
}
#info h1 { font-size: 18px; margin-bottom: 4px; color: #50ff90; }
#info p { font-size: 13px; color: var(--text-2); line-height: 1.5; }
#info .stat { color: #50ff90; }
#controls {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 10px; align-items: center;
  background: rgba(30,30,30,0.85); border-radius: 8px; padding: 10px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(8px);
}
#controls label { font-size: 12px; color: var(--text-2); }
#controls button {
  background: #222; border: 1px solid #444; color: #ccc; padding: 6px 14px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
}
#controls button.active { background: #50ff90; color: #000; border-color: #50ff90; }
#controls button:hover { border-color: #50ff90; }
#legend {
  position: fixed; top: 16px; right: 16px; z-index: 10;
  background: rgba(30,30,30,0.85); border-radius: 12px; padding: 14px 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(8px);
  max-height: 80vh; overflow-y: auto; font-size: 12px;
}
#legend .item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
#legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: rgba(20,20,20,0.95); border: 1px solid #50ff90; border-radius: 8px;
  padding: 12px 16px; box-shadow: 0 8px 32px rgba(0,0,0,.6); max-width: 320px;
}
#tooltip .sym { font-size: 36px; display: block; }
#tooltip .nm { color: var(--text-2); font-size: 12px; display: block; }
#tooltip .stat { color: #50ff90; font-size: 12px; margin-top: 2px; display: block; }
</style>
</head>
<body>
<div id="info">
  <h1>WT4 — Forme 3D</h1>
  <p>Laplacien bipartite projet&eacute; 1316&times;29193<br>
  <span class="stat" id="count"></span><br>
  A = B&middot;B<sup>T</sup>, eigenvectors 1-2-3</p>
</div>
<div id="controls">
  <label>Couleur:</label>
  <button class="active" data-mode="domain">Domaine</button>
  <button data-mode="nd">nd</button>
  <button data-mode="sg">Groupe</button>
  <label style="margin-left:12px">Taille:</label>
  <button class="active" data-size="nd">nd</button>
  <button data-size="deg">Degr&eacute;</button>
  <button data-size="fixed">Fixe</button>
</div>
<div id="legend"></div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const domainColors = {
  'Physics': '#4466ff', 'Mathematics': '#ff6644', 'Computer science': '#44ff66',
  'Chemistry': '#ffaa00', 'Biology': '#ff44ff', 'Medicine': '#ff5050',
  'Engineering': '#00ccaa', 'Materials science': '#5090ff', 'Geology': '#aa8844',
  'Environmental science': '#44ccaa', 'Economics': '#cc88ff', 'Psychology': '#ff88aa',
  'Sociology': '#88aaff', 'Political science': '#aabb44', 'History': '#ddaa66',
  'Philosophy': '#cc66cc', 'Art': '#ff6688', 'Business': '#66ccdd', 'Geography': '#99bb66',
};
const sgColors = {
  'arithmetic': '#ff6644', 'relations': '#44ff66', 'calculus': '#4466ff',
  'set_theory': '#ff44ff', 'algebra': '#ffff44', 'logic': '#44ffff',
  'geometry': '#ff8800', 'greek_lower': '#5090ff', 'greek_upper': '#ff5050',
  'digits': '#ffaa00', 'ouvertures': '#cc44cc', 'fermetures': '#cc44cc',
  'arrows': '#00ccaa', 'subscript_superscript': '#999999', 'accents_modifiers': '#666666',
  'other': '#888888',
};

let scene, camera, renderer, controls, cloud, pts;
let colorMode = 'domain', sizeMode = 'nd';

function hexToRGB(hex) {
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  return [r, g, b];
}

function ndColor(nd) {
  // Gradient: blue (nd=1) → green (nd=10) → red (nd=19)
  const t = Math.min(1, Math.max(0, (nd - 1) / 18));
  if (t < 0.5) {
    const s = t * 2;
    return [0.2*(1-s)+0.2*s, 0.3*(1-s)+0.9*s, 1.0*(1-s)+0.3*s];
  } else {
    const s = (t - 0.5) * 2;
    return [0.2*(1-s)+1.0*s, 0.9*(1-s)+0.3*s, 0.3*(1-s)+0.1*s];
  }
}

function getColor(p) {
  if (colorMode === 'domain') {
    const dom = p.doms && p.doms[0] ? p.doms[0] : 'other';
    const hex = domainColors[dom] || '#888888';
    return hexToRGB(hex);
  } else if (colorMode === 'nd') {
    return ndColor(p.nd || 1);
  } else {
    const hex = sgColors[p.sg] || '#888888';
    return hexToRGB(hex);
  }
}

function getSize(p) {
  if (sizeMode === 'nd') return 3 + (p.nd || 1) * 0.5;
  if (sizeMode === 'deg') return 3 + Math.log10(Math.max(1, p.deg)) * 2;
  return 5;
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 100);
  camera.position.set(2.5, 1.8, 2.5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  scene.add(new THREE.AxesHelper(1.5));
  const grid = new THREE.GridHelper(4, 20, 0x222222, 0x181818);
  scene.add(grid);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // Tooltip
  const raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 0.04;
  const mouse = new THREE.Vector2();
  const tooltip = document.getElementById('tooltip');

  renderer.domElement.addEventListener('mousemove', (e) => {
    if (!cloud || !pts) return;
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(cloud);
    if (hits.length > 0) {
      const p = pts[hits[0].index];
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY + 16) + 'px';
      tooltip.innerHTML = `<span class="sym">${p.sym}</span>`
        + `<span class="nm">${p.name}</span>`
        + `<span class="stat">nd=${p.nd} | deg=${p.deg.toFixed(0)} | ${p.sg}</span>`
        + `<span class="stat">domains: ${(p.doms||[]).join(', ')}</span>`
        + `<span class="stat">x=${p.x.toFixed(3)} y=${p.y.toFixed(3)} z=${p.z.toFixed(3)}</span>`;
    } else {
      tooltip.style.display = 'none';
    }
  });

  animate();
}

function buildCloud() {
  if (!pts) return;
  if (cloud) scene.remove(cloud);

  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(pts.length * 3);
  const colors = new Float32Array(pts.length * 3);
  const sizes = new Float32Array(pts.length);

  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    positions[i*3]   = p.x;
    positions[i*3+1] = p.z;  // z = UP in Three.js
    positions[i*3+2] = p.y;

    const [r, g, b] = getColor(p);
    colors[i*3] = r; colors[i*3+1] = g; colors[i*3+2] = b;
    sizes[i] = getSize(p);
  }

  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    vertexColors: true, transparent: true, depthWrite: false,
    vertexShader: `
      attribute float size;
      varying vec3 vColor;
      void main() {
        vColor = color;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (200.0 / -mvPos.z);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float alpha = 1.0 - smoothstep(0.3, 0.5, d);
        gl_FragColor = vec4(vColor, alpha * 0.85);
      }
    `,
  });

  cloud = new THREE.Points(geom, mat);
  scene.add(cloud);
}

function updateLegend() {
  const legend = document.getElementById('legend');
  let html = '';
  if (colorMode === 'domain') {
    for (const [dom, hex] of Object.entries(domainColors)) {
      html += `<div class="item"><span class="dot" style="background:${hex}"></span>${dom}</div>`;
    }
  } else if (colorMode === 'nd') {
    for (const nd of [1, 4, 8, 12, 16, 19]) {
      const [r,g,b] = ndColor(nd);
      const hex = '#' + [r,g,b].map(v => Math.round(v*255).toString(16).padStart(2,'0')).join('');
      html += `<div class="item"><span class="dot" style="background:${hex}"></span>nd=${nd}</div>`;
    }
  } else {
    for (const [sg, hex] of Object.entries(sgColors)) {
      html += `<div class="item"><span class="dot" style="background:${hex}"></span>${sg}</div>`;
    }
  }
  legend.innerHTML = html;
}

async function loadData() {
  const res = await fetch('data/wt4_spectral.json');
  pts = await res.json();
  document.getElementById('count').textContent = pts.length + ' glyphes';
  buildCloud();
  updateLegend();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Color mode buttons
document.querySelectorAll('#controls button[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls button[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    colorMode = btn.dataset.mode;
    buildCloud();
    updateLegend();
  });
});

// Size mode buttons
document.querySelectorAll('#controls button[data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#controls button[data-size]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sizeMode = btn.dataset.size;
    buildCloud();
  });
});

init();
loadData();
</script>
</body>
</html>
