<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yggdrasil · S-2 Blob Spectral</title>
<style>
:root {
  --bg-0: #121212; --bg-1: #1E1E1E; --bg-2: #252525; --bg-3: #333333;
  --text-1: #E5E5E5; --text-2: #A3A3A3; --text-3: #737373;
  --r: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-1); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
canvas { display: block; }
#info {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  background: var(--bg-2); border-radius: 12px; padding: 16px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
  max-width: 340px;
}
#info h1 { font-size: 18px; margin-bottom: 4px; }
#info p { font-size: 13px; color: var(--text-2); line-height: 1.4; }
#legend {
  position: fixed; top: 16px; right: 16px; z-index: 10;
  background: var(--bg-2); border-radius: 12px; padding: 16px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
#legend h2 { font-size: 14px; margin-bottom: 8px; }
.leg-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 13px; color: var(--text-2); }
.leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
#tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: var(--r);
  padding: 10px 14px; box-shadow: 0 8px 32px rgba(0,0,0,.6);
  font-size: 13px; max-width: 280px;
}
#tooltip .sym { font-size: 28px; display: block; margin-bottom: 4px; }
#tooltip .nm { color: var(--text-2); font-size: 12px; }
#tooltip .stat { color: var(--text-3); font-size: 12px; margin-top: 4px; }
#controls {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 12px; align-items: center;
  background: var(--bg-2); border-radius: var(--r); padding: 8px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
#controls label { font-size: 13px; color: var(--text-2); }
#controls select, #controls input { background: var(--bg-3); color: var(--text-1); border: none; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="info">
  <h1>S-2 Blob Spectral</h1>
  <p>617 glyphes actifs · Laplacien normalisé K=9<br>
  Position = espace spectral (Fiedler x, y)<br>
  Taille = degré (co-occurrences)</p>
</div>
<div id="legend">
  <h2>Domaines touchés</h2>
</div>
<div id="tooltip"><span class="sym"></span><span class="nm"></span><span class="stat"></span></div>
<div id="controls">
  <label>Couleur:</label>
  <select id="colorMode">
    <option value="ndom">Nb domaines</option>
    <option value="group">Groupe sémantique</option>
    <option value="degree">Degré</option>
  </select>
  <label>Min domaines:</label>
  <input type="range" id="filterDom" min="1" max="19" value="1" style="width:100px">
  <span id="filterVal">1</span>
</div>
<canvas id="c"></canvas>
<script>
const DATA_URL = 'data/blob_s2.json';

// Color scales
const domColors = [
  '#444','#6e40aa','#7140c7','#6b51d8','#5c6ce6','#4b8bef',
  '#3ba4f4','#31b8f0','#2fcbe3','#38dccf','#4aeab4','#63f498',
  '#82fb7c','#a4fe63','#c5f84f','#e2ee42','#f8df40','#fecb3e',
  '#feb72d','#f99b1c'
];
const groupColors = {
  'greek':'#f4845f','letter':'#7ec8e3','digit':'#c5e99b','operator':'#ffd166',
  'relation':'#ef476f','arrow':'#118ab2','brackets':'#06d6a0','other':'#888',
  'set_theory':'#b5838d','calculus':'#e0aaff','geometry':'#57cc99',
  'logic':'#f72585','algebra':'#4cc9f0','accent':'#adb5bd'
};

let data = [], cam = {x:0, y:0, zoom:1}, drag = null, canvas, ctx, W, H;
let hoveredIdx = -1;

async function init() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  const resp = await fetch(DATA_URL);
  data = await resp.json();

  // Build legend
  const leg = document.getElementById('legend');
  const counts = [1,2,3,4,5,6,7,8,'13-19'];
  counts.forEach((c,i) => {
    const row = document.createElement('div');
    row.className = 'leg-row';
    const col = typeof c === 'number' ? domColors[c] : domColors[15];
    row.innerHTML = `<div class="leg-dot" style="background:${col}"></div>${c} domaine${typeof c === 'number' && c > 1 ? 's' : ''}`;
    leg.appendChild(row);
  });

  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mousedown', e => { drag = {x: e.clientX - cam.x, y: e.clientY - cam.y}; });
  canvas.addEventListener('mouseup', () => drag = null);
  canvas.addEventListener('mouseleave', () => { drag = null; hideTooltip(); });
  canvas.addEventListener('wheel', onZoom, {passive: false});
  document.getElementById('colorMode').addEventListener('change', draw);
  document.getElementById('filterDom').addEventListener('input', e => {
    document.getElementById('filterVal').textContent = e.target.value;
    draw();
  });

  // Center on data
  let mnx=1e9, mxx=-1e9, mny=1e9, mxy=-1e9;
  data.forEach(g => { mnx=Math.min(mnx,g.x); mxx=Math.max(mxx,g.x); mny=Math.min(mny,g.y); mxy=Math.max(mxy,g.y); });
  const scale = Math.min(W*0.7/(mxx-mnx), H*0.7/(mxy-mny));
  cam.zoom = scale;
  cam.x = W/2 - (mnx+mxx)/2 * scale;
  cam.y = H/2 - (mny+mxy)/2 * scale;

  draw();
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (data.length) draw();
}

function worldToScreen(wx, wy) {
  return [wx * cam.zoom + cam.x, wy * cam.zoom + cam.y];
}

function screenToWorld(sx, sy) {
  return [(sx - cam.x) / cam.zoom, (sy - cam.y) / cam.zoom];
}

function getColor(g) {
  const mode = document.getElementById('colorMode').value;
  if (mode === 'ndom') return domColors[Math.min(g.nd, 19)];
  if (mode === 'group') return groupColors[g.sg] || '#888';
  // degree
  const t = Math.min(1, Math.log(g.d + 1) / Math.log(90000));
  const r = Math.round(50 + t * 200);
  const b = Math.round(250 - t * 200);
  return `rgb(${r},${Math.round(80+t*100)},${b})`;
}

function getRadius(g) {
  if (g.d <= 0) return 2;
  return Math.max(2.5, Math.min(20, Math.sqrt(g.d) * 0.04));
}

function draw() {
  ctx.fillStyle = '#121212';
  ctx.fillRect(0, 0, W, H);

  const minDom = parseInt(document.getElementById('filterDom').value);
  const filtered = data.filter(g => g.nd >= minDom);

  // Draw edges hint: faint connections for low-domain glyphs
  // Skip for perf - just dots

  // Sort by degree (small on top)
  const sorted = [...filtered].sort((a,b) => b.d - a.d);

  sorted.forEach((g, i) => {
    const [sx, sy] = worldToScreen(g.x, g.y);
    if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) return;
    const r = getRadius(g) * Math.sqrt(cam.zoom) * 0.15;
    const col = getColor(g);

    // Glow for rare glyphs (<=4 domains)
    if (g.nd <= 4) {
      ctx.beginPath();
      ctx.arc(sx, sy, r * 3, 0, Math.PI * 2);
      ctx.fillStyle = col.replace(')', ',0.15)').replace('rgb', 'rgba');
      if (col.startsWith('#')) {
        ctx.fillStyle = col + '26';
      }
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();

    // Draw symbol for big enough or rare glyphs
    if ((r * cam.zoom > 300 || g.nd <= 4) && cam.zoom > 200) {
      ctx.fillStyle = '#E5E5E5';
      ctx.font = `${Math.max(10, r*1.2)}px 'Segoe UI'`;
      ctx.textAlign = 'center';
      ctx.fillText(g.s, sx, sy - r - 3);
    }
  });

  // Highlight hovered
  if (hoveredIdx >= 0 && hoveredIdx < data.length) {
    const g = data[hoveredIdx];
    if (g.nd >= minDom) {
      const [sx, sy] = worldToScreen(g.x, g.y);
      const r = getRadius(g) * Math.sqrt(cam.zoom) * 0.15;
      ctx.beginPath();
      ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#E5E5E5';
      ctx.font = `bold 16px 'Segoe UI'`;
      ctx.textAlign = 'center';
      ctx.fillText(g.s, sx, sy - r - 8);
    }
  }
}

function onMove(e) {
  if (drag) {
    cam.x = e.clientX - drag.x;
    cam.y = e.clientY - drag.y;
    draw();
    return;
  }

  const mx = e.clientX, my = e.clientY;
  const minDom = parseInt(document.getElementById('filterDom').value);
  let best = -1, bestDist = 20;

  data.forEach((g, i) => {
    if (g.nd < minDom) return;
    const [sx, sy] = worldToScreen(g.x, g.y);
    const dist = Math.hypot(sx - mx, sy - my);
    const r = getRadius(g) * Math.sqrt(cam.zoom) * 0.15;
    if (dist < Math.max(r + 5, 10) && dist < bestDist) {
      best = i;
      bestDist = dist;
    }
  });

  if (best !== hoveredIdx) {
    hoveredIdx = best;
    draw();
    if (best >= 0) showTooltip(e, data[best]);
    else hideTooltip();
  } else if (best >= 0) {
    positionTooltip(e);
  }
}

function showTooltip(e, g) {
  const tt = document.getElementById('tooltip');
  tt.querySelector('.sym').textContent = g.s;
  tt.querySelector('.nm').textContent = g.n;
  tt.querySelector('.stat').textContent = `${g.nd} domaine${g.nd>1?'s':''} · degré ${Math.round(g.d)} · ${g.sg}`;
  tt.style.display = 'block';
  positionTooltip(e);
}

function positionTooltip(e) {
  const tt = document.getElementById('tooltip');
  let tx = e.clientX + 16, ty = e.clientY - 10;
  if (tx + 280 > W) tx = e.clientX - 290;
  if (ty + 80 > H) ty = H - 80;
  tt.style.left = tx + 'px';
  tt.style.top = ty + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
  hoveredIdx = -1;
}

function onZoom(e) {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  const mx = e.clientX, my = e.clientY;
  cam.x = mx - (mx - cam.x) * factor;
  cam.y = my - (my - cam.y) * factor;
  cam.zoom *= factor;
  draw();
}

init();
</script>
</body>
</html>
