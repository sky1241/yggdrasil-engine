<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yggdrasil · God Cube Réel</title>
<style>
:root { --bg-0: #0a0a0a; --text-1: #E5E5E5; --text-2: #A3A3A3; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-1); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
#info {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  background: rgba(30,30,30,0.85); border-radius: 12px; padding: 16px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); max-width: 340px; backdrop-filter: blur(8px);
}
#info h1 { font-size: 18px; margin-bottom: 4px; color: #50ff90; }
#info p { font-size: 13px; color: var(--text-2); line-height: 1.5; }
#tooltip {
  position: fixed; z-index: 20; pointer-events: none; display: none;
  background: rgba(20,20,20,0.95); border: 1px solid #50ff90; border-radius: 8px;
  padding: 12px 16px; box-shadow: 0 8px 32px rgba(0,0,0,.6); max-width: 320px;
}
#tooltip .sym { font-size: 36px; display: block; }
#tooltip .nm { color: var(--text-2); font-size: 12px; display: block; }
#tooltip .stat { color: #50ff90; font-size: 12px; margin-top: 4px; display: block; }
#controls {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center;
  background: rgba(30,30,30,0.85); border-radius: 8px; padding: 10px 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,.5); backdrop-filter: blur(8px);
}
#controls label { font-size: 13px; color: var(--text-2); white-space: nowrap; }
#controls input[type=range] { width: 80px; }
#controls input[type=checkbox] { accent-color: #50ff90; }
.cg { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="info">
  <h1>God Cube · Forme Réelle</h1>
  <p>19 domaines (taille = papers)<br>
  Frontières = glyphes partagés entre 2 domaines<br>
  Positions = Laplacien 19×19<br>
  <br>Clic: rotation · Scroll: zoom · Clic droit: pan</p>
</div>
<div id="tooltip"><span class="sym"></span><span class="nm"></span><span class="stat"></span></div>
<div id="controls">
  <div class="cg">
    <label>Frontières:</label>
    <input type="checkbox" id="showBorders" checked>
  </div>
  <div class="cg">
    <label>Glyphes:</label>
    <input type="checkbox" id="showGlyphs" checked>
  </div>
  <div class="cg">
    <label>Opacité fronts:</label>
    <input type="range" id="borderAlpha" min="1" max="100" value="30">
  </div>
  <div class="cg">
    <label>Auto-rot:</label>
    <input type="checkbox" id="autoRot" checked>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script>
let scene, camera, renderer;
let allObjects = [];
let glyphSprites = [];
let borderLines = [];
let raycaster, mouse = new THREE.Vector2();
let hoveredIdx = -1;
let data = null;
let isDragging = false, prevMouse = {x:0, y:0, button:0};
let spherical = {theta: 0.6, phi: 1.0, radius: 55};
let panOffset = new THREE.Vector3(0, 0, 0);

const DC = {
  "Art":"#e040fb","Biology":"#66bb6a","Business":"#ffa726","Chemistry":"#ef5350",
  "Computer science":"#42a5f5","Economics":"#ffee58","Engineering":"#8d6e63",
  "Environmental science":"#26a69a","Geography":"#78909c","Geology":"#a1887f",
  "History":"#ce93d8","Materials science":"#ff7043","Mathematics":"#5c6bc0",
  "Medicine":"#ec407a","Philosophy":"#ab47bc","Physics":"#29b6f6",
  "Political science":"#d4e157","Psychology":"#7e57c2","Sociology":"#26c6da"
};

async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
  updateCamera();
  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  scene.add(new THREE.DirectionalLight(0xffffff, 0.6).position.set(10,20,15) && new THREE.DirectionalLight(0xffffff, 0.6));

  const resp = await fetch('data/blob_mesh.json');
  data = await resp.json();

  // Center
  let cx=0,cy=0,cz=0,n=0;
  data.domains.forEach(d => { cx+=d.x; cy+=d.y; cz+=d.z; n++; });
  cx/=n; cy/=n; cz/=n;
  data.domains.forEach(d => { d.x-=cx; d.y-=cy; d.z-=cz; });
  data.border_glyphs.forEach(g => { g.x-=cx; g.y-=cy; g.z-=cz; });
  data.borders.forEach(b => { b.ax-=cx; b.ay-=cy; b.az-=cz; b.bx-=cx; b.by-=cy; b.bz-=cz; });

  buildDomains();
  buildBorderLines();
  buildGlyphs();

  raycaster = new THREE.Raycaster();
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('mousedown', e => { isDragging=true; prevMouse={x:e.clientX,y:e.clientY,button:e.button}; });
  renderer.domElement.addEventListener('mouseup', () => isDragging=false);
  renderer.domElement.addEventListener('mouseleave', () => { isDragging=false; hideTooltip(); });
  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    spherical.radius = Math.max(10, Math.min(150, spherical.radius*(1+e.deltaY*0.001)));
    updateCamera();
  }, {passive:false});
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('showBorders').addEventListener('change', () => {
    borderLines.forEach(l => l.visible = document.getElementById('showBorders').checked);
  });
  document.getElementById('showGlyphs').addEventListener('change', () => {
    glyphSprites.forEach(s => s.visible = document.getElementById('showGlyphs').checked);
  });
  document.getElementById('borderAlpha').addEventListener('input', () => {
    const a = parseInt(document.getElementById('borderAlpha').value)/100;
    borderLines.forEach(l => { l.material.opacity = a; });
  });

  animate();
}

function buildDomains() {
  data.domains.forEach(d => {
    const col = new THREE.Color(DC[d.name] || '#888');

    // Sphere sized by papers
    const geo = new THREE.SphereGeometry(d.radius, 24, 16);
    const mat = new THREE.MeshPhongMaterial({
      color: col, emissive: col, emissiveIntensity: 0.3,
      transparent: true, opacity: 0.6
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(d.x, d.y, d.z);
    scene.add(mesh);
    allObjects.push(mesh);

    // Label
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = DC[d.name] || '#888';
    ctx.font = 'bold 36px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(d.name, 256, 44);
    const tex = new THREE.CanvasTexture(canvas);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
    sp.position.set(d.x, d.y + d.radius + 1.5, d.z);
    sp.scale.set(12, 1.5, 1);
    scene.add(sp);
    allObjects.push(sp);
  });
}

function buildBorderLines() {
  const alpha = parseInt(document.getElementById('borderAlpha').value)/100;

  data.borders.forEach(b => {
    // Line thickness ~ n_glyphs
    const colA = new THREE.Color(DC[b.domA] || '#888');
    const colB = new THREE.Color(DC[b.domB] || '#888');
    const midCol = colA.clone().lerp(colB, 0.5);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      b.ax, b.ay, b.az, b.bx, b.by, b.bz
    ], 3));

    const mat = new THREE.LineBasicMaterial({
      color: midCol, transparent: true,
      opacity: Math.min(alpha, b.n_glyphs / 1300 * alpha),
      depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
    borderLines.push(line);
  });
}

function buildGlyphs() {
  data.border_glyphs.forEach((g, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = 48; canvas.height = 48;
    const ctx = canvas.getContext('2d');

    // Color = mix of the two domains
    const colA = DC[g.domA] || '#888';
    const colB = DC[g.domB] || '#888';
    // Use domA color weighted by wa
    const t = g.wb / (g.wa + g.wb + 0.001);
    ctx.fillStyle = t < 0.5 ? colA : colB;
    ctx.font = '32px Segoe UI Symbol, Cambria Math, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(g.s, 24, 24);

    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false, opacity: 0.85});
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(g.x, g.y, g.z);
    sprite.scale.set(0.6, 0.6, 1);
    sprite.userData = {idx: i, data: g};
    scene.add(sprite);
    glyphSprites.push(sprite);
  });
}

function updateCamera() {
  const r = spherical.radius;
  camera.position.set(
    r*Math.sin(spherical.phi)*Math.sin(spherical.theta)+panOffset.x,
    r*Math.cos(spherical.phi)+panOffset.y,
    r*Math.sin(spherical.phi)*Math.cos(spherical.theta)+panOffset.z
  );
  camera.lookAt(panOffset);
}

function onMouseMove(e) {
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  if (isDragging) {
    const dx=(e.clientX-prevMouse.x)*0.005, dy=(e.clientY-prevMouse.y)*0.005;
    if (prevMouse.button===2) { panOffset.x-=dx*5; panOffset.y+=dy*5; }
    else { spherical.theta-=dx; spherical.phi=Math.max(0.15,Math.min(Math.PI-0.15,spherical.phi+dy)); }
    prevMouse.x=e.clientX; prevMouse.y=e.clientY;
    updateCamera();
    return;
  }
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(glyphSprites);
  if (hits.length>0) {
    const obj=hits[0].object, idx=obj.userData.idx;
    if (idx!==hoveredIdx) {
      resetHover(); hoveredIdx=idx;
      obj.scale.setScalar(1.5);
      showTooltip(e, obj.userData.data);
    } else posTooltip(e);
  } else { resetHover(); hoveredIdx=-1; hideTooltip(); }
}
function resetHover() {
  if (hoveredIdx>=0) {
    const sp=glyphSprites.find(s=>s.userData&&s.userData.idx===hoveredIdx);
    if(sp) sp.scale.set(0.6,0.6,1);
  }
}
function showTooltip(e,g) {
  const tt=document.getElementById('tooltip');
  tt.querySelector('.sym').textContent=g.s;
  tt.querySelector('.nm').textContent=g.domA+' ↔ '+g.domB;
  tt.querySelector('.stat').innerHTML=g.nd+' domaines · poids: '+Math.round(g.wa)+' / '+Math.round(g.wb);
  tt.style.display='block'; posTooltip(e);
}
function posTooltip(e) {
  const tt=document.getElementById('tooltip');
  let x=e.clientX+16,y=e.clientY-10;
  if(x+300>window.innerWidth) x=e.clientX-310;
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display='none'; }

function animate() {
  requestAnimationFrame(animate);
  if(document.getElementById('autoRot').checked&&!isDragging) { spherical.theta+=0.002; updateCamera(); }
  renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
